<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Marca de desTajo: monograma retro en pixeles sobre negro.
       El anillo y el asta forman la d; la barra superior la convierte en T; y el
       trazo diagonal que sale del asta es el tajo. Un solo color, aristas rectas
       y el halo de fosforo de una pantalla antigua. -->
  <defs>
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <g id="marka" fill="#6ee787" shape-rendering="crispEdges">
      <rect x="176" y="96" width="176" height="16"/>
      <rect x="176" y="112" width="176" height="16"/>
      <rect x="176" y="128" width="176" height="16"/>
      <rect x="416" y="128" width="16" height="16"/>
      <rect x="240" y="144" width="48" height="16"/>
      <rect x="400" y="144" width="64" height="16"/>
      <rect x="240" y="160" width="48" height="16"/>
      <rect x="384" y="160" width="64" height="16"/>
      <rect x="240" y="176" width="48" height="16"/>
      <rect x="368" y="176" width="64" height="16"/>
      <rect x="128" y="192" width="160" height="16"/>
      <rect x="352" y="192" width="64" height="16"/>
      <rect x="112" y="208" width="176" height="16"/>
      <rect x="336" y="208" width="64" height="16"/>
      <rect x="96" y="224" width="192" height="16"/>
      <rect x="320" y="224" width="64" height="16"/>
      <rect x="80" y="240" width="64" height="16"/>
      <rect x="208" y="240" width="80" height="16"/>
      <rect x="304" y="240" width="64" height="16"/>
      <rect x="80" y="256" width="48" height="16"/>
      <rect x="224" y="256" width="128" height="16"/>
      <rect x="64" y="272" width="64" height="16"/>
      <rect x="240" y="272" width="112" height="16"/>
      <rect x="64" y="288" width="48" height="16"/>
      <rect x="240" y="288" width="96" height="16"/>
      <rect x="64" y="304" width="48" height="16"/>
      <rect x="240" y="304" width="80" height="16"/>
      <rect x="64" y="320" width="64" height="16"/>
      <rect x="240" y="320" width="64" height="16"/>
      <rect x="80" y="336" width="48" height="16"/>
      <rect x="224" y="336" width="64" height="16"/>
      <rect x="80" y="352" width="80" height="16"/>
      <rect x="192" y="352" width="80" height="16"/>
      <rect x="96" y="368" width="160" height="16"/>
      <rect x="112" y="384" width="128" height="16"/>
      <rect x="144" y="400" width="64" height="16"/>
    </g>
  </defs>
  <rect width="512" height="512" rx="104" fill="#0b0f0d"/>
  <use href="#marka" filter="url(#halo)" opacity="0.5"/>
  <use href="#marka"/>
</svg>
