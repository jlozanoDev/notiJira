<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Marca de desTajo: una d en pixeles sobre negro, en una sola silueta.
       El anillo y el asta son el mismo trazo; el asta sube por la derecha.
       Un solo color, aristas rectas y el halo de fosforo de una pantalla vieja. -->
  <defs>
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <g id="marka" fill="#6ee787" shape-rendering="crispEdges">
      <rect x="320" y="64" width="64" height="16"/>
      <rect x="320" y="80" width="64" height="16"/>
      <rect x="320" y="96" width="64" height="16"/>
      <rect x="320" y="112" width="64" height="16"/>
      <rect x="320" y="128" width="64" height="16"/>
      <rect x="320" y="144" width="64" height="16"/>
      <rect x="320" y="160" width="64" height="16"/>
      <rect x="320" y="176" width="64" height="16"/>
      <rect x="192" y="192" width="192" height="16"/>
      <rect x="160" y="208" width="224" height="16"/>
      <rect x="144" y="224" width="240" height="16"/>
      <rect x="144" y="240" width="240" height="16"/>
      <rect x="128" y="256" width="96" height="16"/>
      <rect x="288" y="256" width="96" height="16"/>
      <rect x="128" y="272" width="80" height="16"/>
      <rect x="304" y="272" width="80" height="16"/>
      <rect x="112" y="288" width="80" height="16"/>
      <rect x="320" y="288" width="80" height="16"/>
      <rect x="112" y="304" width="80" height="16"/>
      <rect x="320" y="304" width="80" height="16"/>
      <rect x="112" y="320" width="64" height="16"/>
      <rect x="320" y="320" width="80" height="16"/>
      <rect x="112" y="336" width="80" height="16"/>
      <rect x="320" y="336" width="80" height="16"/>
      <rect x="112" y="352" width="80" height="16"/>
      <rect x="320" y="352" width="80" height="16"/>
      <rect x="128" y="368" width="80" height="16"/>
      <rect x="304" y="368" width="80" height="16"/>
      <rect x="128" y="384" width="96" height="16"/>
      <rect x="288" y="384" width="96" height="16"/>
      <rect x="144" y="400" width="240" height="16"/>
      <rect x="144" y="416" width="240" height="16"/>
      <rect x="160" y="432" width="224" height="16"/>
      <rect x="192" y="448" width="192" height="16"/>
    </g>
  </defs>
  <rect width="512" height="512" rx="104" fill="#0b0f0d"/>
  <use href="#marka" filter="url(#halo)" opacity="0.5"/>
  <use href="#marka"/>
</svg>
